name: Supabase Keep-Alive Ping

on:
  schedule:
    # Run every Monday and Thursday at 00:00 UTC to prevent the 7-day inactivity pause
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project URL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL secret is not set!"
            exit 1
          fi
          # Ping the REST API root
          curl -f -s -o /dev/null "$SUPABASE_URL/rest/v1/" || echo "Ping failed, but workflow will continue"
